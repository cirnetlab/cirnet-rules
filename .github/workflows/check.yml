name: Check toolkit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: cargo fmt --all -- --check
      - name: Test Task Continuity
        shell: pwsh
        run: ./tests/continuity/task-continuity.tests.ps1
      - name: Test Task Continuity discovery and bootstrap
        shell: pwsh
        run: ./tests/continuity/bootstrap.tests.ps1
      - name: Validate Work Prompt handoffs offline
        shell: pwsh
        run: ./tests/validation/work-prompt.tests.ps1
      - run: node --test ./tests/benchmark/source.test.mjs ./tests/benchmark/rtl.test.mjs
      - name: Test verification preview and retry decisions
        run: node --test ./tests/verification/preview-owner-checks.test.mjs ./tests/verification/retry-policy.test.mjs
      - name: Test pinned claim evidence
        shell: pwsh
        run: ./tests/verification/verify-claim.tests.ps1
      - name: Test reviewed execution evidence
        shell: pwsh
        run: |
          ./tests/verification/strict-claim.tests.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tests/verification/strict-claim.tests.ps1 -Related
      - name: Test claim and process status reporting
        shell: pwsh
        run: ./tests/verification/report-claim.tests.ps1
      - name: Test RTL trace evidence collection
        shell: pwsh
        run: ./tests/benchmark/rtl.tests.ps1
      - run: cargo test --offline --locked
      - name: Check documentation and added Markdown files
        shell: pwsh
        env:
          CIRNET_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check-changed-docs.ps1 -Base $env:CIRNET_DOC_BASE
      - name: Test changed Markdown selection
        shell: pwsh
        run: ./tests/validation/check-changed-docs.tests.ps1
      - run: cargo clippy --offline --locked --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/distribution/package.Tests.ps1
          ./tests/distribution/install.tests.ps1
          ./tests/benchmark/role.tests.ps1
          ./tests/benchmark/followup.tests.ps1
      - name: Test unified fixture checks on Ubuntu
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $env:CIRNET_TEST_OUTPUT = (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'cirnet-fixture-tests')).FullName
          node --test ./tests/benchmark/checks.test.mjs ./tests/benchmark/privacy.test.mjs
      - name: Test single Candidate session with a local shim
        shell: pwsh
        run: ./tests/benchmark/session.tests.ps1
