name: Check toolkit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: cargo fmt --all -- --check
      - run: node --test ./tests/model-compatibility-source.test.mjs
      - run: cargo test --offline --locked
      - name: Check documentation and added Markdown files
        shell: pwsh
        env:
          CIRNET_DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check-changed-docs.ps1 -Base $env:CIRNET_DOC_BASE
      - name: Test changed Markdown selection
        shell: pwsh
        run: ./tests/check-changed-docs.tests.ps1
      - run: cargo clippy --offline --locked --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/package.Tests.ps1
          ./tests/install.tests.ps1
          ./tests/behavioral.tests.ps1
      - name: Test Candidate-only model smoke with a local shim
        shell: pwsh
        run: ./tests/model-compatibility.tests.ps1
