name: Governance verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Validate governance and bilingual sources
        shell: pwsh
        run: |
          $cli = if ($IsWindows) { './target/debug/cirnet-governance.exe' } else { './target/debug/cirnet-governance' }
          & $cli validate
          exit $LASTEXITCODE
