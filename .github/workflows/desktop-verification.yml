name: CIRNETRULES desktop verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64, qt6]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and test the Rust runtime
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --bins
          exit $LASTEXITCODE
      - name: Build, test and stage the native Dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP "cirnetrules-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $runtime = (Resolve-Path 'target/release/cirnetrules-runtime.exe').Path
          if (!$env:Qt6_DIR -and !$env:CMAKE_PREFIX_PATH) { throw 'Configure the approved Qt 6 kit on the runner.' }
          cmake -S . -B $build -G 'Visual Studio 17 2022' -A x64 "-DCIRNETRULES_RUNTIME_EXECUTABLE=$runtime" -DCIRNETRULES_DEPLOY_QT=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install $build --config Release --prefix (Join-Path $build 'stage')
          exit $LASTEXITCODE
