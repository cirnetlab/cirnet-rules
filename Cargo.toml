[package]
name = "cirnetrules"
version = "0.1.0"
edition = "2024"
build = "src/build_identity.rs"
rust-version = "1.99"
license-file = "LICENSE"
publish = false

[[bin]]
name = "cirnet-governance"
path = "src/main.rs"

[[bin]]
name = "cnr"
path = "src/cli/main.rs"

[[test]]
name = "cnr"
path = "src/tests/cnr.rs"

[[test]]
name = "cli"
path = "src/tests/cli.rs"

[[test]]
name = "mcp_wire"
path = "src/mcp/wire.rs"

[dependencies]
base64 = "=0.22.1"
clap = { version = "=4.5.51", default-features = false, features = ["std", "help", "usage", "error-context"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }
futures = { version = "=0.3.32", default-features = false, features = ["std"] }
getrandom = "=0.3.4"
jsonschema = { version = "=0.33.0", default-features = false }
pulldown-cmark = { version = "=0.13.0", default-features = false }
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "backup"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
toml = "=0.9.8"
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.18", default-features = false, features = ["codec", "rt"] }
unicode-width = { version = "=0.2.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
serde_json = "=1.0.145"
toml = "=0.9.8"
