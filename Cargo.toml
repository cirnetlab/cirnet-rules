[package]
name = "cirnet-governance"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
publish = false

[[bin]]
name = "cirnet-governance"
path = "en/tools/src/main.rs"

[[test]]
name = "cli"
path = "en/tests/cli.rs"

[dependencies]
base64 = "=0.22.1"
jsonschema = { version = "=0.33.0", default-features = false }
pulldown-cmark = { version = "=0.13.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
toml = "=0.9.8"
